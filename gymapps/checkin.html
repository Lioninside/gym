<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Check-in</title>
  <link rel="stylesheet" href="shared.css" />
  <style>
    .ci-page {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      padding: 16px;
      overflow: hidden;
    }

    .top-bar {
      flex-shrink: 0;
      margin-bottom: 8px;
    }

    #syncNotice {
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-radius: 12px;
      padding: 10px 12px;
      color: var(--amber);
      text-align: center;
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    #statusNotice {
      background: rgba(34, 197, 94, 0.10);
      border: 1px solid rgba(34, 197, 94, 0.25);
      border-radius: 12px;
      padding: 8px 12px;
      color: var(--green);
      text-align: center;
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    .hidden {
      display: none !important;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.5rem;
      color: var(--text);
      margin: 0;
    }

    .label {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
    }

    input,
    textarea {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      padding: 12px 14px;
      box-sizing: border-box;
      outline: none;
      font: inherit;
    }

    textarea {
      min-height: 52px;
      resize: none;
    }

    #viewIdle {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 16px;
      overflow: hidden;
    }

    .toggle-group {
      display: flex;
      gap: 8px;
    }

    .toggle-option {
      flex: 1;
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.2rem;
      cursor: pointer;
      user-select: none;
    }

    .toggle-option.selected.weights {
      background: linear-gradient(135deg, #6c63f5 0%, #554ee8 100%);
      color: white;
      border-color: transparent;
    }

    .toggle-option.selected.cardio {
      background: linear-gradient(135deg, #e91e8c 0%, #c21874 100%);
      color: white;
      border-color: transparent;
    }

    #viewResume {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 10px;
    }

    .resume-title {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.5rem;
      color: var(--text);
    }

    .resume-meta {
      font-family: 'DM Mono', monospace;
      font-weight: 500;
      color: var(--muted);
      line-height: 1.5;
    }

    #viewActive {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .active-type-label {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      flex-shrink: 0;
    }

    .active-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .active-timer {
      font-family: 'DM Mono', monospace;
      font-weight: 500;
      font-size: clamp(3.4rem, 14vw, 5rem);
      line-height: 1;
      color: var(--text);
    }

    .active-timer.warning-color {
      color: var(--amber);
    }

    .active-warning {
      margin-top: 12px;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--amber);
      text-align: center;
    }

    .active-buttons {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    #viewSummary {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: hidden;
    }

    .summary-elapsed {
      font-family: 'DM Mono', monospace;
      font-weight: 500;
      font-size: clamp(2.4rem, 10vw, 3rem);
      line-height: 1;
      color: var(--green);
      text-align: center;
      flex-shrink: 0;
      margin-top: 4px;
    }

    .limit-msg {
      text-align: center;
      color: var(--amber);
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      flex-shrink: 0;
    }

    .time-row {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .time-field {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .summary-section,
    .summary-comment {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }

    .chip-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .chip {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--muted);
      padding: 8px 14px;
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      user-select: none;
    }

    .chip.selected {
      background: linear-gradient(135deg, #6c63f5 0%, #554ee8 100%);
      border-color: transparent;
      color: white;
    }

    .summary-buttons {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
      padding-top: 4px;
    }
  </style>
</head>
<body>
  <div class="ci-page">
    <div class="top-bar">
      <a class="back-link" href="index.html">← back</a>
    </div>

    <div id="syncNotice" class="hidden">Saved locally — will sync on next open</div>
    <div id="statusNotice" class="hidden"></div>

    <!-- IDLE -->
    <div id="viewIdle" class="hidden">
      <h1>Check-in</h1>

      <div>
        <div class="label" style="margin-bottom:8px;">Training type</div>
        <div class="toggle-group">
          <div
            class="toggle-option selected weights"
            id="toggleWeights"
            onclick="selectType('weights')"
          >
            Weights
          </div>
          <div
            class="toggle-option cardio"
            id="toggleCardio"
            onclick="selectType('cardio')"
          >
            Cardio
          </div>
        </div>
      </div>

      <button class="btn-primary" onclick="startSession()">Start Training</button>
    </div>

    <!-- RESUME -->
    <div id="viewResume" class="hidden">
      <div class="resume-title">Active session found</div>
      <div class="resume-meta" id="resumeMeta"></div>
      <button class="btn-primary" onclick="resumeSession()">Resume</button>
      <button class="btn-secondary" onclick="stopNow()">Stop now</button>
      <button class="btn-danger" onclick="discardSession()">Discard</button>
    </div>

    <!-- ACTIVE -->
    <div id="viewActive" class="hidden">
      <div class="active-type-label" id="activeTypeLabel">Weights</div>

      <div class="active-center">
        <div class="active-timer" id="activeTimer">0:00</div>
        <div class="active-warning hidden" id="activeWarning">2h limit approaching</div>
      </div>

      <div class="active-buttons">
        <button class="btn-secondary" id="btnPause" onclick="togglePause()">Pause Training</button>
        <button class="btn-danger" onclick="stopSession()">Stop Training</button>
      </div>
    </div>

    <!-- SUMMARY -->
    <div id="viewSummary" class="hidden">
      <div class="summary-elapsed" id="summaryElapsed">0:00</div>
      <div class="limit-msg hidden" id="limitMsg"></div>

      <div class="time-row">
        <div class="time-field">
          <div class="label">Start</div>
          <input type="time" id="editStart" />
        </div>
        <div class="time-field">
          <div class="label">End</div>
          <input type="time" id="editEnd" />
        </div>
      </div>

      <div class="summary-section">
        <div class="label">Mood</div>
        <div class="chip-group">
          <div class="chip" data-group="mood" data-val="Hard" onclick="selectChip(this)">Hard</div>
          <div class="chip" data-group="mood" data-val="Tired" onclick="selectChip(this)">Tired</div>
          <div class="chip" data-group="mood" data-val="Good" onclick="selectChip(this)">Good</div>
        </div>
      </div>

      <div class="summary-section">
        <div class="label">Last food</div>
        <div class="chip-group">
          <div class="chip" data-group="food" data-val="<1h" onclick="selectChip(this)">&lt;1h</div>
          <div class="chip" data-group="food" data-val="1-2h" onclick="selectChip(this)">1–2h</div>
          <div class="chip" data-group="food" data-val="2-3h" onclick="selectChip(this)">2–3h</div>
          <div class="chip" data-group="food" data-val="3h+" onclick="selectChip(this)">3h+</div>
        </div>
      </div>

      <div class="summary-comment">
        <div class="label">Comment</div>
        <textarea id="commentInput" placeholder="optional"></textarea>
      </div>

      <div class="summary-buttons">
        <button class="btn-primary" onclick="saveSession()">Save Session</button>
        <button class="btn-danger" onclick="discardSummary()">Discard</button>
      </div>
    </div>
  </div>

  <script src="shared.js"></script>
  <script>
    const SHEET_URL = 'https://script.google.com/macros/s/AKfycbwpjNSMLRY9Ava4hvYii0XWIDk-XYmEkT2eoF6gxCfQoP3IzOFpFvfsmCQOL3FzY_R9iw/exec';

    const WARN_MS = 105 * 60 * 1000;
    const LIMIT_MS = 120 * 60 * 1000;
    const HB_INTERVAL = 10 * 60 * 1000;

    let timer = new LiveTimer();
    let sessionType = 'weights';
    let rafId = null;
    let hbTimer = null;
    let warned = false;
    let autoStopped = false;
    let summaryEndTs = null;

    const LS = {
      save() {
        localStorage.setItem('ci_startTs', timer.startTs || '');
        localStorage.setItem('ci_pausedMs', String(timer.pausedMs || 0));
        localStorage.setItem('ci_pauseTs', timer.pauseTs || '');
        localStorage.setItem('ci_status', 'active');
        localStorage.setItem('ci_type', sessionType);
      },

      clear() {
        [
          'ci_startTs',
          'ci_pausedMs',
          'ci_pauseTs',
          'ci_status',
          'ci_type',
          'ci_rowId'
        ].forEach((k) => localStorage.removeItem(k));
      },

      load() {
        return {
          startTs: parseInt(localStorage.getItem('ci_startTs'), 10) || null,
          pausedMs: parseInt(localStorage.getItem('ci_pausedMs'), 10) || 0,
          pauseTs: parseInt(localStorage.getItem('ci_pauseTs'), 10) || null,
          status: localStorage.getItem('ci_status'),
          type: localStorage.getItem('ci_type') || 'weights',
          rowId: localStorage.getItem('ci_rowId')
        };
      }
    };

    function showStatus(msg, ok = true) {
      const el = document.getElementById('statusNotice');
      el.textContent = msg;
      el.style.color = ok ? 'var(--green)' : 'var(--red)';
      el.style.borderColor = ok ? 'rgba(34,197,94,0.25)' : 'rgba(239,68,68,0.25)';
      el.style.background = ok ? 'rgba(34,197,94,0.10)' : 'rgba(239,68,68,0.10)';
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 3000);
    }

    function showSyncNotice() {
      const el = document.getElementById('syncNotice');
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 4000);
    }

    function storePending(payload) {
      const q = JSON.parse(localStorage.getItem('ci_pending') || '[]');
      q.push(payload);
      localStorage.setItem('ci_pending', JSON.stringify(q));
    }

    async function flushPending() {
      const q = JSON.parse(localStorage.getItem('ci_pending') || '[]');
      if (!q.length) return;

      const remaining = [];
      for (const payload of q) {
        const ok = await sheetPost(payload, true);
        if (!ok) remaining.push(payload);
      }

      localStorage.setItem('ci_pending', JSON.stringify(remaining));
    }

    async function sheetPing() {
      try {
        const res = await fetch(`${SHEET_URL}?action=ping`, {
          method: 'GET'
        });
        return await res.json();
      } catch (e) {
        return { ok: false };
      }
    }

    async function sheetGet() {
      try {
        const res = await fetch(`${SHEET_URL}?action=get&date=${encodeURIComponent(todayKey())}`, {
          method: 'GET'
        });
        return await res.json();
      } catch (e) {
        return null;
      }
    }

    async function sheetPost(data, skipQueue = false) {
      try {
        await fetch(SHEET_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },
          body: JSON.stringify(data)
        });
        return true;
      } catch (e) {
        if (!skipQueue) {
          storePending(data);
          showSyncNotice();
        }
        return false;
      }
    }

    function showView(id) {
      ['viewIdle', 'viewResume', 'viewActive', 'viewSummary'].forEach((v) => {
        document.getElementById(v).classList.toggle('hidden', v !== id);
      });
    }

    function selectType(type) {
      sessionType = type;

      const weights = document.getElementById('toggleWeights');
      const cardio = document.getElementById('toggleCardio');

      weights.classList.toggle('selected', type === 'weights');
      cardio.classList.toggle('selected', type === 'cardio');
    }

    function selectChip(el) {
      document
        .querySelectorAll(`.chip[data-group="${el.dataset.group}"]`)
        .forEach((c) => c.classList.remove('selected'));
      el.classList.add('selected');
    }

    function getChipVal(group) {
      const el = document.querySelector(`.chip[data-group="${group}"].selected`);
      return el ? el.dataset.val : '';
    }

    function makeRowId() {
      return `${todayKey()}-${Date.now()}`;
    }

    function getRowId() {
      let id = localStorage.getItem('ci_rowId');
      if (!id) {
        id = makeRowId();
        localStorage.setItem('ci_rowId', id);
      }
      return id;
    }

    function tsToTimeStr(ts) {
      const d = new Date(ts);
      return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    }

    function weekday(ts) {
      return ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][new Date(ts).getDay()];
    }

    function formatDuration(ms) {
      const total = Math.floor(ms / 1000);
      const h = Math.floor(total / 3600);
      const m = Math.floor((total % 3600) / 60);
      const s = total % 60;
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function resetVisualWarnings() {
      document.getElementById('activeWarning').classList.add('hidden');
      document.getElementById('activeTimer').classList.remove('warning-color');
      document.getElementById('limitMsg').classList.add('hidden');
    }

    async function startSession() {
      timer.start();

      sessionType = document.getElementById('toggleWeights').classList.contains('selected')
        ? 'weights'
        : 'cardio';

      warned = false;
      autoStopped = false;
      summaryEndTs = null;
      resetVisualWarnings();

      LS.save();

      const rowId = getRowId();
      await sheetPost({
        action: 'start',
        rowId,
        date: todayKey(),
        weekday: weekday(timer.startTs),
        start: tsToTimeStr(timer.startTs),
        type: sessionType,
        status: 'active',
        created_at: new Date(timer.startTs).toISOString()
      });

      startHB();
      document.getElementById('activeTypeLabel').textContent =
        sessionType.charAt(0).toUpperCase() + sessionType.slice(1);

      showView('viewActive');
      runActiveLoop();
    }

    function resumeSession() {
      const s = LS.load();
      sessionType = s.type;
      timer.restore(s.startTs, s.pausedMs, s.pauseTs);

      warned = false;
      autoStopped = false;
      summaryEndTs = null;
      resetVisualWarnings();

      document.getElementById('activeTypeLabel').textContent =
        sessionType.charAt(0).toUpperCase() + sessionType.slice(1);

      document.getElementById('btnPause').textContent = timer.running
        ? 'Pause Training'
        : 'Resume Training';

      startHB();
      showView('viewActive');
      runActiveLoop();
    }

    function togglePause() {
      if (timer.running) {
        timer.pause();
        document.getElementById('btnPause').textContent = 'Resume Training';
      } else {
        timer.resume();
        document.getElementById('btnPause').textContent = 'Pause Training';
      }
      LS.save();
    }

    function runActiveLoop() {
      if (rafId) cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(activeLoop);
    }

    function activeLoop() {
      const elapsed = timer.elapsed();
      const timerEl = document.getElementById('activeTimer');
      const warnEl = document.getElementById('activeWarning');

      timerEl.textContent = formatTime(elapsed);

      if (!warned && elapsed >= WARN_MS) {
        warned = true;
        timerEl.classList.add('warning-color');
        warnEl.classList.remove('hidden');
      }

      if (!autoStopped && elapsed >= LIMIT_MS) {
        autoStopped = true;
        summaryEndTs = Date.now();
        document.getElementById('limitMsg').textContent = '2h limit reached';
        document.getElementById('limitMsg').classList.remove('hidden');
        stopHB();
        showSummaryView(elapsed);
        return;
      }

      rafId = requestAnimationFrame(activeLoop);
    }

    function stopSession() {
      if (rafId) cancelAnimationFrame(rafId);
      stopHB();
      summaryEndTs = Date.now();
      showSummaryView(timer.elapsed());
    }

    function stopNow() {
      const s = LS.load();
      timer.restore(s.startTs, s.pausedMs, s.pauseTs);
      sessionType = s.type;
      summaryEndTs = Date.now();
      showSummaryView(timer.elapsed());
    }

    function showSummaryView(elapsed) {
      if (rafId) cancelAnimationFrame(rafId);

      document.getElementById('summaryElapsed').textContent = formatTime(elapsed);
      document.getElementById('editStart').value = timer.startTs ? tsToTimeStr(timer.startTs) : '';
      document.getElementById('editEnd').value = tsToTimeStr(summaryEndTs || Date.now());
      document.getElementById('commentInput').value = '';

      document.querySelectorAll('.chip').forEach((c) => c.classList.remove('selected'));

      showView('viewSummary');
    }

    async function saveSession() {
      const elapsed = timer.elapsed();

      const payload = {
        action: 'stop',
        rowId: getRowId(),
        date: todayKey(),
        weekday: weekday(timer.startTs),
        start: document.getElementById('editStart').value,
        end: document.getElementById('editEnd').value,
        duration: formatDuration(elapsed),
        type: sessionType,
        mood: getChipVal('mood'),
        last_food: getChipVal('food'),
        comment: document.getElementById('commentInput').value.trim(),
        status: 'done',
        heartbeat_elapsed: Math.floor(elapsed / 1000),
        created_at: new Date(timer.startTs).toISOString(),
        updated_at: new Date().toISOString()
      };

      await sheetPost(payload);
      LS.clear();
      window.location.href = 'index.html';
    }

    async function discardSummary() {
      await sheetPost({
        action: 'discard',
        rowId: getRowId(),
        status: 'cancelled',
        updated_at: new Date().toISOString()
      });

      LS.clear();
      resetToIdle();
    }

    async function discardSession() {
      const s = LS.load();

      if (s.rowId) {
        await sheetPost({
          action: 'discard',
          rowId: s.rowId,
          status: 'cancelled',
          updated_at: new Date().toISOString()
        });
      }

      LS.clear();
      resetToIdle();
    }

    function resetToIdle() {
      if (rafId) cancelAnimationFrame(rafId);
      stopHB();

      timer = new LiveTimer();
      warned = false;
      autoStopped = false;
      summaryEndTs = null;

      resetVisualWarnings();
      document.getElementById('btnPause').textContent = 'Pause Training';

      showView('viewIdle');
    }

    function startHB() {
      stopHB();
      hbTimer = setInterval(() => {
        LS.save();
        sheetPost({
          action: 'heartbeat',
          rowId: getRowId(),
          heartbeat_elapsed: Math.floor(timer.elapsed() / 1000),
          updated_at: new Date().toISOString()
        });
      }, HB_INTERVAL);
    }

    function stopHB() {
      if (hbTimer) {
        clearInterval(hbTimer);
        hbTimer = null;
      }
    }

    async function init() {
      const ping = await sheetPing();
      if (ping && ping.ok) {
        showStatus('Google Sheets connected', true);
      } else {
        showStatus('Google Sheets unreachable', false);
      }

      await flushPending();

      const s = LS.load();
      if (s.status === 'active' && s.startTs) {
        const started = new Date(s.startTs);
        const now = new Date();

        const sameDay =
          started.getFullYear() === now.getFullYear() &&
          started.getMonth() === now.getMonth() &&
          started.getDate() === now.getDate();

        if (sameDay) {
          const elapsed = s.pauseTs
            ? s.pauseTs - s.startTs - s.pausedMs
            : Date.now() - s.startTs - s.pausedMs;

          document.getElementById('resumeMeta').textContent =
            `${s.type} · ${formatTime(elapsed)} elapsed · started ${tsToTimeStr(s.startTs)}`;

          sessionType = s.type;
          selectType(s.type);
          showView('viewResume');
          return;
        }

        LS.clear();
      }

      const cloud = await sheetGet();
      if (cloud && cloud.status === 'active') {
        document.getElementById('resumeMeta').textContent =
          `${cloud.type || 'weights'} · started ${cloud.start}`;
        showView('viewResume');
        return;
      }

      showView('viewIdle');
    }

    init();
  </script>
</body>
</html>
