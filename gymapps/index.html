<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Gymapps</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .index-page {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      padding: 20px 16px 16px;
      overflow: hidden;
    }

    .index-header {
      flex-shrink: 0;
      margin-bottom: 24px;
    }

    .index-title {
      font-size: 2rem;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 4px;
    }

    .index-subtitle {
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--muted);
    }

    .index-nav {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      justify-content: center;
    }

    .nav-item {
      display: block;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
      text-decoration: none;
      color: var(--text);
      transition: filter 0.1s;
    }

    .nav-item:active { filter: brightness(0.8); }

    .nav-item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-item-name {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .nav-item-arrow {
      font-size: 1rem;
      color: var(--muted);
      font-weight: 500;
    }

    .nav-item-desc {
      font-size: 0.8rem;
      font-weight: 400;
      color: var(--muted);
      margin-top: 2px;
    }

    .nav-item.green  .nav-item-name { color: #75b798; }
    .nav-item.blue   .nav-item-name { color: #6ea8fe; }
    .nav-item.pink   .nav-item-name { color: #f78fb3; }
    .nav-item.amber  .nav-item-name { color: var(--amber); }

    .index-footer {
      flex-shrink: 0;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .footer-brand {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 3px;
    }

    .footer-text {
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .footer-text a { color: #6ea8fe; text-decoration: none; }
  </style>
</head>
<body>
  <div class="index-page">

    <header class="index-header">
      <div class="index-title">Gymapps</div>
      <div class="index-subtitle">by Lioninside</div>
    </header>

    <nav class="index-nav">
      <a class="nav-item green" href="checkin.html">
        <div class="nav-item-row">
          <span class="nav-item-name">Check-in</span>
          <span class="nav-item-arrow">→</span>
        </div>
        <div class="nav-item-desc">Track training sessions</div>
      </a>

      <a class="nav-item blue" href="timer.html">
        <div class="nav-item-row">
          <span class="nav-item-name">Timer</span>
          <span class="nav-item-arrow">→</span>
        </div>
        <div class="nav-item-desc">Countdown for sets and holds</div>
      </a>

      <a class="nav-item pink" href="core_interval.html">
        <div class="nav-item-row">
          <span class="nav-item-name">Core Interval</span>
          <span class="nav-item-arrow">→</span>
        </div>
        <div class="nav-item-desc">Guided 3-lap core circuit</div>
      </a>

      <a class="nav-item amber" href="reaction.html">
        <div class="nav-item-row">
          <span class="nav-item-name">Reaction</span>
          <span class="nav-item-arrow">→</span>
        </div>
        <div class="nav-item-desc">Random beep trigger</div>
      </a>
    </nav>

    <footer class="index-footer">
      <div class="footer-brand">Lioninside</div>
      <div class="footer-text">
        By Clemens. Gym apps, built to spec. My spec.<br>
        <a href="https://lioninside.com/myprojects/workout-timer-gym-tools-einfache-tools-fuers-training-ohne-app/" target="_blank">lioninside.com</a>
        &nbsp;·&nbsp;
        <a href="https://github.com/Lioninside/gym" target="_blank">GitHub →</a>
      </div>
    </footer>

  </div>
</body>
</html>
