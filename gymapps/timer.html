<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Timer</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .timer-page {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 16px;
      overflow: hidden;
    }

    h1 {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 14px;
      flex-shrink: 0;
    }

    .timer-list {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      justify-content: center;
    }

    .timer-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 16px 20px;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      text-align: left;
    }

    .timer-btn:active { filter: brightness(0.85); }

    .timer-btn.running {
      border-color: var(--blue);
      background: rgba(13,110,253,0.08);
    }

    .timer-btn.done {
      border-color: #198754;
      background: rgba(25,135,84,0.08);
    }

    .timer-btn.overtime {
      border-color: var(--amber);
      background: rgba(255,193,7,0.07);
    }

    .tb-label {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
    }

    .tb-time {
      font-family: 'DM Mono', monospace;
      font-weight: 500;
      font-size: 1.4rem;
      color: var(--text);
      min-width: 70px;
      text-align: right;
    }

    .timer-btn.running  .tb-time { color: #6ea8fe; }
    .timer-btn.done     .tb-time { color: #75b798; }
    .timer-btn.overtime .tb-time { color: var(--amber); }

    .tb-status {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--muted);
      margin-top: 1px;
    }

    .timer-btn.running  .tb-status { color: #6ea8fe; }
    .timer-btn.done     .tb-status { color: #75b798; }
    .timer-btn.overtime .tb-status { color: var(--amber); }
  </style>
</head>
<body>
  <div class="timer-page">

    <div class="top-bar"><a href="index.html">← Back</a></div>
    <h1>Timer</h1>

    <div class="timer-list" id="timerList"></div>

  </div>

  <script src="shared.js"></script>
  <script>
    const PRESETS = [
      { label: '1:00', sec: 60  },
      { label: '1:30', sec: 90  },
      { label: '2:00', sec: 120 },
      { label: '2:45', sec: 165 },
      { label: '3:00', sec: 180 },
      { label: '4:00', sec: 240 },
    ];

    let activeBtn  = null;
    let startTs    = null;
    let durSec     = 0;
    let rafId      = null;
    let beeped     = false;

    const list = document.getElementById('timerList');

    // Build buttons
    PRESETS.forEach(p => {
      const btn = document.createElement('button');
      btn.className = 'timer-btn';
      btn.dataset.sec = p.sec;
      btn.innerHTML = `
        <div>
          <div class="tb-label">${p.label}</div>
          <div class="tb-status">tap to start</div>
        </div>
        <div class="tb-time">${p.label}</div>
      `;
      btn.addEventListener('click', () => startTimer(btn, p.sec));
      list.appendChild(btn);
    });

    function startTimer(btn, sec) {
      if (rafId) cancelAnimationFrame(rafId);

      // Reset previous active button display
      if (activeBtn && activeBtn !== btn) {
        const prevSec = parseInt(activeBtn.dataset.sec);
        activeBtn.className = 'timer-btn';
        activeBtn.querySelector('.tb-time').textContent = secFmt(prevSec);
        activeBtn.querySelector('.tb-status').textContent = 'tap to start';
      }

      activeBtn = btn;
      startTs   = Date.now();
      durSec    = sec;
      beeped    = false;

      btn.className = 'timer-btn running';
      btn.querySelector('.tb-status').textContent = 'running';

      loop();
    }

    function loop() {
      const elapsed  = Date.now() - startTs;
      const remainMs = durSec * 1000 - elapsed;

      if (remainMs > 0) {
        const s = Math.ceil(remainMs / 1000);
        activeBtn.querySelector('.tb-time').textContent = secFmt(s);
        activeBtn.className = 'timer-btn running';
        activeBtn.querySelector('.tb-status').textContent = 'running';
      } else {
        if (!beeped) {
          beeped = true;
          beep(1046, 0.18, 0.8);
          activeBtn.className = 'timer-btn done';
          activeBtn.querySelector('.tb-status').textContent = 'done';
        }
        const overSec = Math.floor(-remainMs / 1000);
        if (overSec > 0) {
          activeBtn.className = 'timer-btn overtime';
          activeBtn.querySelector('.tb-time').textContent = `-${secFmt(overSec)}`;
          activeBtn.querySelector('.tb-status').textContent = 'overtime';
        } else {
          activeBtn.querySelector('.tb-time').textContent = '0:00';
        }
      }

      rafId = requestAnimationFrame(loop);
    }

    function secFmt(s) {
      const m = Math.floor(s / 60);
      const r = s % 60;
      return `${m}:${String(r).padStart(2, '0')}`;
    }
  </script>
</body>
</html>
