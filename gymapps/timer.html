<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Timer</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .timer-page {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 16px;
      overflow: hidden;
      gap: 12px;
    }

    /* ── Slider ── */
    .duration-config {
      flex-shrink: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .dur-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .dur-label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .dur-value {
      font-family: 'DM Mono', monospace;
      font-size: 1rem;
      font-weight: 500;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px 10px;
    }

    /* ── Timer cards ── */
    .timer-cards {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .timer-card {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .start-btn {
      flex: 1;
      font-size: 1.5rem;
      font-weight: 700;
      border-radius: 10px;
      color: #fff;
      border: none;
      cursor: pointer;
      transition: filter 0.1s;
      min-height: 72px;
    }

    .start-btn:active { filter: brightness(0.8); }

    .start-a { background: var(--blue); }
    .start-b { background: #c2185b; }

    .timer-display {
      font-family: 'DM Mono', monospace;
      font-size: 2.2rem;
      font-weight: 500;
      text-align: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px;
      line-height: 1;
      flex-shrink: 0;
      transition: color 0.2s;
    }

    .timer-display.running  { color: #6ea8fe; border-color: var(--blue); }
    .timer-display.done     { color: #75b798; border-color: var(--green); }
    .timer-display.overtime { color: var(--amber); border-color: var(--amber); }
    .timer-display.idle     { color: var(--muted); }
  </style>
</head>
<body>
  <div class="timer-page">

    <div class="top-bar"><a href="index.html">← Back</a></div>

    <div class="duration-config">
      <div class="dur-row">
        <span class="dur-label">Duration</span>
        <span class="dur-value" id="durDisplay">2:45</span>
      </div>
      <input type="range" id="durSlider" min="30" max="300" step="5" value="165">
    </div>

    <div class="timer-cards">
      <div class="timer-card">
        <button class="start-btn start-a" onclick="pressTimer('a')">Start A</button>
        <div class="timer-display idle" id="dispA">--:--</div>
      </div>
      <div class="timer-card">
        <button class="start-btn start-b" onclick="pressTimer('b')">Start B</button>
        <div class="timer-display idle" id="dispB">--:--</div>
      </div>
    </div>

  </div>

  <script src="shared.js"></script>
  <script>
    const slider   = document.getElementById('durSlider');
    const durDisp  = document.getElementById('durDisplay');
    const dispA    = document.getElementById('dispA');
    const dispB    = document.getElementById('dispB');

    // Each timer is independent
    const timers = {
      a: { startTs: null, durSec: 0, rafId: null, beeped: false, el: dispA },
      b: { startTs: null, durSec: 0, rafId: null, beeped: false, el: dispB },
    };

    slider.addEventListener('input', () => {
      const s = parseInt(slider.value);
      durDisp.textContent = secFmt(s);
    });

    function pressTimer(id) {
      const t = timers[id];
      if (t.rafId) cancelAnimationFrame(t.rafId);
      t.startTs = Date.now();
      t.durSec  = parseInt(slider.value);
      t.beeped  = false;
      t.el.className = 'timer-display running';
      tickTimer(id);
    }

    function tickTimer(id) {
      const t       = timers[id];
      const elapsed = Date.now() - t.startTs;
      const remainMs = t.durSec * 1000 - elapsed;

      if (remainMs > 0) {
        t.el.className   = 'timer-display running';
        t.el.textContent = mmss(Math.ceil(remainMs / 1000));
      } else {
        if (!t.beeped) {
          t.beeped = true;
          beep(1046, 0.18, 0.8);
          t.el.className = 'timer-display done';
        }
        const over = Math.floor(-remainMs / 1000);
        if (over > 0) {
          t.el.className   = 'timer-display overtime';
          t.el.textContent = '-' + mmss(over);
        } else {
          t.el.textContent = mmss(0);
        }
      }

      t.rafId = requestAnimationFrame(() => tickTimer(id));
    }

    // MM:SS with leading zeros
    function mmss(totalSec) {
      const m = Math.floor(totalSec / 60);
      const s = totalSec % 60;
      return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }

    function secFmt(s) {
      const m = Math.floor(s / 60);
      const r = s % 60;
      return `${m}:${String(r).padStart(2,'0')}`;
    }
  </script>
</body>
</html>
